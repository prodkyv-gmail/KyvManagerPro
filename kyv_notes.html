<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f111a">
  <title>KYV · Taccuino</title>
  <link rel="icon" href="./favicon.ico">
  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4"></script>
  <script src="https://unpkg.com/lucide@0.468.0"></script>
  <script>tailwind.config={theme:{extend:{colors:{kyv:{bg:'#0f111a',card:'#151923',border:'#232838',accent:'#6366f1',text:'#94a3b8'}}}}};</script>
  <script src="config.js"></script>
  <script src="kyv-core.js"></script>
  <script src="kyv-auth.js"></script>
  <script src="menu.js"></script>
  <script src="kyv-notes-core.js"></script>
  <script src="kyv-notes-files.js"></script>
  <link rel="stylesheet" href="kyv-responsive.css">
  <link rel="stylesheet" href="kyv-theme.css">
  <link rel="stylesheet" href="kyv-notes-simple.css">
  <script src="kyv-notes-simple.js" defer></script>
</head>
<body data-auth-required="true" class="kyv-notes-simple-page flex h-screen overflow-hidden antialiased text-sm">
  <div id="kyv-sidebar-container" class="h-full z-50 absolute md:relative shrink-0"></div>
  <main class="kyv-simple-notebook flex-1 min-w-0" aria-label="Taccuino KYV">
    <header class="kyv-simple-header">
      <div class="kyv-simple-heading">
        <button type="button" class="kyv-simple-menu md:hidden" onclick="toggleMobileMenu()" aria-label="Apri menu"><i data-lucide="menu"></i></button>
        <div>
          <p class="kyv-simple-eyebrow">Il tuo spazio di lavoro</p>
          <h1>Taccuino KYV</h1>
          <p class="kyv-simple-subtitle">Tutte le note, subito a portata di mano.</p>
        </div>
      </div>
      <button type="button" id="notes-new" class="kyv-simple-primary"><i data-lucide="plus"></i><span>Nuova nota</span></button>
    </header>

    <section class="kyv-simple-content">
      <div class="kyv-simple-controls">
        <label class="kyv-simple-search" for="notes-search">
          <i data-lucide="search"></i>
          <input type="search" id="notes-search" autocomplete="off" placeholder="Cerca nelle note…" aria-label="Cerca per titolo e descrizione">
        </label>
        <span id="notes-count" class="kyv-simple-count" aria-live="polite"></span>
      </div>
      <p id="notes-status" class="kyv-simple-status" role="status" aria-live="polite">Caricamento note…</p>
      <div id="notes-list" class="kyv-simple-list" aria-live="polite" aria-label="Elenco delle note"></div>
    </section>
  </main>

  <div id="notes-dialog" class="kyv-simple-overlay" role="dialog" aria-modal="true" aria-labelledby="notes-dialog-title" aria-describedby="notes-dialog-help" hidden>
    <div class="kyv-simple-modal">
      <div class="kyv-simple-modal-header">
        <h2 id="notes-dialog-title">Nuova nota</h2>
        <button type="button" id="notes-dialog-close" class="kyv-simple-icon-button" aria-label="Chiudi" title="Chiudi"><i data-lucide="x"></i></button>
      </div>
      <form id="notes-form" class="kyv-simple-form">
        <p id="notes-dialog-help" class="kyv-simple-form-help">Solo titolo e descrizione. Il titolo è facoltativo.</p>
        <label for="notes-title">Titolo</label>
        <input id="notes-title" name="title" maxlength="180" autocomplete="off" placeholder="Titolo della nota">
        <label for="notes-content">Descrizione</label>
        <textarea id="notes-content" name="content" rows="8" maxlength="30000" placeholder="Scrivi la tua nota…"></textarea>
        <details id="notes-existing-media" class="kyv-simple-attachments" hidden>
          <summary>Contenuti già salvati</summary>
          <audio id="notes-existing-audio" controls preload="none" hidden></audio>
          <div id="notes-existing-files"></div>
        </details>
        <p id="notes-dialog-status" class="kyv-simple-dialog-status" role="status" aria-live="polite"></p>
        <div class="kyv-simple-form-actions">
          <button type="button" id="notes-cancel" class="kyv-simple-secondary">Annulla</button>
          <button type="submit" id="notes-save" class="kyv-simple-primary"><i data-lucide="check"></i>Salva</button>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
