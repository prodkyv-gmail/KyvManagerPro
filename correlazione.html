<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="icon" href="./favicon.ico">
    <title>KYV Studio - Correlazione Fatture</title>
    <script>
        // Filtra il warning non bloccante della CDN Tailwind in ambiente statico.
        (function(){
            const originalWarn = console.warn;
            console.warn = function(){
                const first = String(arguments[0] || '');
                if(first.includes('cdn.tailwindcss.com should not be used in production')) return;
                return originalWarn.apply(console, arguments);
            };
        })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="config.js"></script>
    <script src="kyv-drive-bridge.js"></script>
    <script src="kyv-core.js"></script>
    <script src="kyv-toast.js"></script>
    <script src="kyv-helpers.js"></script>
    <script src="kyv-data-guard.js"></script>
    <script src="kyv-priority.js"></script>
    <script src="kyv-help.js"></script>
    <script src="kyv-auth.js"></script>
    <script src="menu.js"></script>
<script src="kyv-responsive.js" defer></script>
    <script src="kyv-searchable-select.js" defer></script>
    <script src="kyv-field-memory.js" defer></script>
    <script src="kyv-link-viewer.js" defer></script>
    <script src="kyv-table-tools.js" defer></script>
    <script src="kyv-record-editor.js" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] }, colors: { kyv: { bg: '#0f111a', card: '#151923', border: '#232838', accent: '#6366f1', text: '#94a3b8' } } } } }</script>
        <link rel="stylesheet" href="kyv-responsive.css">
<style>
        body { background-color: #0f111a; color: #f8fafc; }
        ::-webkit-scrollbar { width: 12px; height: 12px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #232838; border-radius: 6px; }
        .custom-scrollbar::-webkit-scrollbar { height: 12px; width: 12px; }
        
        .kyv-input { width: 100%; background-color: #0f111a; border: 1px solid #232838; color: white; padding: 0.5rem 0.75rem; border-radius: 0.5rem; outline: none; transition: border-color 0.15s ease-in-out; }
        .kyv-input:focus-visible { border-color: #6366f1; box-shadow: 0 0 0 2px #0f111a, 0 0 0 4px #6366f1; }
        [data-action] { cursor: pointer; }
        /* Nuove Scrollbar Allargate e Chiare */
        ::-webkit-scrollbar { width: 16px; height: 16px; } 
        ::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.02); border-radius: 8px; } 
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 8px; border: 4px solid #0f111a; }
        ::-webkit-scrollbar-thumb:hover { background: #6b7280; }
        .custom-scrollbar { scrollbar-width: auto; scrollbar-color: #4b5563 rgba(255, 255, 255, 0.02); }
        .custom-scrollbar::-webkit-scrollbar { width: 16px; height: 16px; }
    </style>
    <link rel="stylesheet" href="kyv-theme.css">
</head>
<body class="flex h-screen overflow-hidden antialiased text-sm">
    <div id="kyv-sidebar-container" class="h-full z-50 absolute md:relative"></div>

    <main class="flex-1 flex flex-col h-screen overflow-hidden relative w-full">
        <section class="flex-1 flex flex-col h-full">
            <header class="pt-8 px-4 md:px-8 pb-4 border-b border-kyv-border/50 shrink-0">
                <div class="flex flex-col xl:flex-row items-start xl:items-end justify-between gap-5">
                    <div class="flex items-center">
                        <button class="md:hidden kyv-icon-action mr-3" onclick="toggleMobileMenu()" aria-label="Apri menu"><i data-lucide="menu" class="w-6 h-6"></i></button>
                        <div>
                            <p class="kyv-eyebrow mb-1">Controllo collegamenti</p>
                            <h2 class="text-3xl md:text-4xl font-extrabold tracking-tight text-white">Correlazione fatture</h2>
                            <p class="text-kyv-text mt-2 text-xs md:text-sm">Clicca la riga per modificare la fattura; clicca il progetto per completarne i dati.</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-2 w-full xl:w-auto">
                        <div class="relative flex-1 xl:w-72">
                            <i data-lucide="search" class="w-4 h-4 absolute left-3 top-3 text-kyv-text"></i>
                            <input type="search" id="correlazione-search" placeholder="Fattura, cliente, progetto…" class="w-full bg-kyv-bg border border-kyv-border rounded-xl pl-9 pr-4 py-2.5 text-sm text-white focus:border-indigo-500 outline-none transition-colors" oninput="applyCorrelazioneFilters()">
                        </div>
                        <button type="button" data-kyv-new-table="FATTURE" class="kyv-primary-action whitespace-nowrap"><i data-lucide="plus" class="w-4 h-4 mr-2"></i>Nuova</button>
                        <button onclick="fetchFattureCorrelate()" class="kyv-icon-action shrink-0" aria-label="Ricarica correlazioni" title="Ricarica"><i data-lucide="refresh-cw" class="w-4 h-4"></i></button>
                    </div>
                </div>
            </header>
            
            <div class="flex-1 overflow-auto bg-kyv-bg relative custom-scrollbar p-4 md:p-8 space-y-8">
                <!-- DA PAGARE -->
                <div>
                    <h3 class="text-red-400 font-bold mb-4 flex items-center justify-between"><span class="flex items-center"><i data-lucide="alert-circle" class="w-5 h-5 mr-2"></i> FATTURE DA PAGARE</span><span class="text-lg bg-red-900/30 px-4 py-1 rounded-lg border border-red-500/30 font-black tracking-wide" id="tot-da-pagare">€ 0,00</span></h3>
                    <div class="bg-red-900/10 rounded-xl border border-red-500/20 overflow-hidden shadow-lg"><div class="overflow-x-auto"><table class="kyv-card-mode w-full text-left text-sm whitespace-nowrap"><thead class="bg-red-900/20 text-red-300 uppercase tracking-wider text-[10px] border-b border-red-500/20"><tr><th class="px-6 py-3 font-semibold">N° / Data</th><th class="px-6 py-3 font-semibold">Denominazione</th><th class="px-6 py-3 font-semibold">Descrizione & Progetto</th><th class="px-6 py-3 font-semibold">Importo</th></tr></thead><tbody class="divide-y divide-red-500/10" id="tbody-ft-nopag"></tbody></table></div></div>
                </div>
                <!-- PAGATE -->
                <div>
                    <h3 class="text-emerald-400 font-bold mb-4 flex items-center justify-between"><span class="flex items-center"><i data-lucide="check-circle-2" class="w-5 h-5 mr-2"></i> FATTURE PAGATE</span><span class="text-lg bg-emerald-900/30 px-4 py-1 rounded-lg border border-emerald-500/30 font-black tracking-wide" id="tot-pagate">€ 0,00</span></h3>
                    <div class="bg-emerald-900/10 rounded-xl border border-emerald-500/20 overflow-hidden shadow-lg"><div class="overflow-x-auto"><table class="kyv-card-mode w-full text-left text-sm whitespace-nowrap"><thead class="bg-emerald-900/20 text-emerald-300 uppercase tracking-wider text-[10px] border-b border-emerald-500/20"><tr><th class="px-6 py-3 font-semibold">N° / Data</th><th class="px-6 py-3 font-semibold">Denominazione</th><th class="px-6 py-3 font-semibold">Descrizione & Progetto</th><th class="px-6 py-3 font-semibold">Importo</th></tr></thead><tbody class="divide-y divide-emerald-500/10" id="tbody-ft-pag"></tbody></table></div></div>
                </div>
            </div>
        </section>
    </main>

    <script>
        if(typeof loadKyvSidebar === 'undefined'){ window.toggleMobileMenu=()=>{}; window.loadKyvSidebar=()=>{ document.getElementById('kyv-sidebar-container').innerHTML=`<aside class="w-64 bg-kyv-card border-r h-full p-4">Fallback Menu</aside>`;};}
        loadKyvSidebar('correlazione');

        const fallbackUrl = 'https://sfclxyexipbgiohpwlnl.supabase.co';
        const fallbackKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNmY2x4eWV4aXBiZ2lvaHB3bG5sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExMTIwMDUsImV4cCI6MjA5NjY4ODAwNX0.6HJpyQGJBh4Gxyk4gcG6svm_b066XUvoyNk2UI8EHaY';
        const supabaseClient = KYV.createSupabaseClient();

        const fmtEuro = new Intl.NumberFormat('it-IT', { style: 'currency', currency: 'EUR' });
        function parseKyvNumber(val) { return (window.KYV_HELPERS ? KYV_HELPERS.parseKyvNumber(val) : KYV.parseNumber(val)); }
        const H = (value) => KYV.safeHtml(value ?? '');

        let correlazioneFattureGlobal = [], correlazioneProjMapGlobal = {};
        
        async function fetchFattureCorrelate() {
            document.getElementById('tbody-ft-nopag').innerHTML = '<tr><td colspan="4" class="p-4 text-center"><i data-lucide="loader-2" class="w-6 h-6 animate-spin mx-auto mb-2 text-indigo-500"></i></td></tr>'; document.getElementById('tbody-ft-pag').innerHTML = '<tr><td colspan="4" class="p-4 text-center"><i data-lucide="loader-2" class="w-6 h-6 animate-spin mx-auto mb-2 text-indigo-500"></i></td></tr>'; if(window.lucide) lucide.createIcons();
            try {
                const [fatRes, projRes] = await Promise.all([supabaseClient.from('FATTURE').select('ID_FT, Numero, Data, Denominazione, Descrizione, PrezzoUnitario, PAGATA, ID_PROGETTO').order('Data', { ascending: false }), supabaseClient.from('PROGETTI').select('ID, TITOLO')]);
                if(fatRes.error) throw fatRes.error;
                correlazioneProjMapGlobal = {}; if(projRes.data) projRes.data.forEach(p => { correlazioneProjMapGlobal[p.ID] = p.TITOLO; });
                correlazioneFattureGlobal = fatRes.data || []; document.getElementById('correlazione-search').value = ''; window.applyCorrelazioneFilters();
            } catch(e) {}
        }

        window.applyCorrelazioneFilters = function() {
            const searchTxt = (document.getElementById('correlazione-search')?.value || '').toLowerCase();
            let hNopag = [], hPag = [], sumDaPagare = 0, sumPagate = 0;
            correlazioneFattureGlobal.forEach(f => {
                let linkedProj = f.ID_PROGETTO ? correlazioneProjMapGlobal[f.ID_PROGETTO] : null;
                let combinedStr = `${f.Numero} ${f.Denominazione} ${f.Descrizione} ${linkedProj}`.toLowerCase();
                if (searchTxt && !combinedStr.includes(searchTxt)) return;
                
                let isPagata = f.PAGATA && String(f.PAGATA).toUpperCase().includes('SI');
                let numVal = parseKyvNumber(f.PrezzoUnitario); let imp = fmtEuro.format(numVal); let d = f.Data ? new Date(f.Data).toLocaleDateString('it-IT') : '-';
                
                let projBadge = linkedProj ? `<button type="button" class="mt-2 inline-flex px-2 py-1 rounded-lg text-[10px] font-bold bg-indigo-500/10 text-indigo-200 border border-indigo-500/20 hover:bg-indigo-500/20 transition-colors" data-kyv-edit-table="PROGETTI" data-kyv-edit-id="${H(f.ID_PROGETTO)}" title="Modifica dati del progetto"><i data-lucide="folder-pen" class="w-3 h-3 mr-1"></i>${H(linkedProj)}</button>` : '<span class="mt-2 text-[10px] text-amber-200">Progetto non collegato</span>';
                 
                let tr = `<tr class="kyv-editable-row hover:bg-kyv-border/30 transition-colors border-b border-kyv-border/30 cursor-pointer group" data-kyv-edit-table="FATTURE" data-kyv-edit-id="${H(f.ID_FT)}" title="Apri e modifica la fattura">
                            <td data-label="Numero / Data" class="px-6 py-3 font-medium group-hover:text-indigo-300 transition-colors"><i data-lucide="pencil" class="w-3 h-3 inline mr-2 opacity-60"></i>N° ${H(f.Numero || '-')}<br><span class="text-xs opacity-60 ml-5">${H(d)}</span></td>
                            <td data-label="Denominazione" class="px-6 py-3 truncate max-w-[200px]">${H(f.Denominazione || '-')}</td>
                            <td data-label="Descrizione / Progetto" class="px-6 py-3 whitespace-normal opacity-90"><span class="block truncate max-w-[300px]">${H(f.Descrizione || '-')}</span>${projBadge}</td>
                            <td data-label="Importo" class="px-6 py-3 font-black">${H(imp)}</td></tr>`;
                
                if(isPagata) { hPag.push(tr); sumPagate += numVal; } else { hNopag.push(tr); sumDaPagare += numVal; }
            });
            document.getElementById('tot-da-pagare').innerText = fmtEuro.format(sumDaPagare); document.getElementById('tot-pagate').innerText = fmtEuro.format(sumPagate);
            document.getElementById('tbody-ft-nopag').innerHTML = hNopag.length ? hNopag.join('') : '<tr><td colspan="4" class="p-4 text-center opacity-50">Nessuna fattura trovata</td></tr>'; document.getElementById('tbody-ft-pag').innerHTML = hPag.length ? hPag.join('') : '<tr><td colspan="4" class="p-4 text-center opacity-50">Nessuna fattura trovata</td></tr>';
            if(window.lucide) lucide.createIcons();
        }

        document.addEventListener('DOMContentLoaded', () => {
            KYV_RECORD_EDITOR.create({ client: supabaseClient, onSaved: fetchFattureCorrelate });
            fetchFattureCorrelate();
        });
    </script>
</body>
</html>
