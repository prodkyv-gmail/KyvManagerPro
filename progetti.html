<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="icon" href="./favicon.ico">
    <title>KYV Studio - Progetti</title>
    
    <script>
        // Filtra il warning non bloccante della CDN Tailwind in ambiente statico.
        (function(){
            const originalWarn = console.warn;
            console.warn = function(){
                const first = String(arguments[0] || '');
                if(first.includes('cdn.tailwindcss.com should not be used in production')) return;
                return originalWarn.apply(console, arguments);
            };
        })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="config.js"></script>
    <script src="kyv-drive-bridge.js"></script>
    <script src="kyv-core.js"></script>
    <script src="kyv-toast.js"></script>
    <script src="kyv-helpers.js"></script>
    <script src="kyv-data-guard.js"></script>
    <script src="kyv-priority.js"></script>
    <script src="kyv-help.js"></script>
    <script src="kyv-auth.js"></script>
    <script src="menu.js"></script>
<script src="kyv-responsive.js" defer></script>
    <script src="kyv-searchable-select.js" defer></script>
    <script src="kyv-field-memory.js" defer></script>
    <script src="kyv-link-viewer.js" defer></script>
    <script src="kyv-table-tools.js" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] }, colors: { kyv: { bg: '#0f111a', card: '#151923', border: '#232838', accent: '#6366f1', text: '#94a3b8' } } } } }
    </script>
        <link rel="stylesheet" href="kyv-responsive.css">
<style>
        body { background-color: #0f111a; color: #f8fafc; }
        ::-webkit-scrollbar { width: 12px; height: 12px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #232838; border-radius: 6px; }
        ::-webkit-scrollbar-thumb:hover { background: #333a50; }
        .custom-scrollbar::-webkit-scrollbar { height: 12px; width: 12px; }
        
        /* Stili per gli input del modal */
        .kyv-input { width: 100%; background-color: #0f111a; border: 1px solid #232838; color: white; padding: 0.5rem 0.75rem; border-radius: 0.5rem; outline: none; transition: border-color 0.15s ease-in-out; }
        .kyv-input:focus-visible { border-color: #6366f1; box-shadow: 0 0 0 2px #0f111a, 0 0 0 4px #6366f1; }
        [data-action] { cursor: pointer; }
 /* Nuove Scrollbar Allargate e Chiare */
        ::-webkit-scrollbar { width: 16px; height: 16px; } 
        ::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.02); border-radius: 8px; } 
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 8px; border: 4px solid #0f111a; }
        ::-webkit-scrollbar-thumb:hover { background: #6b7280; }
        .custom-scrollbar { scrollbar-width: auto; scrollbar-color: #4b5563 rgba(255, 255, 255, 0.02); }
        .custom-scrollbar::-webkit-scrollbar { width: 16px; height: 16px; }
    </style>
    <link rel="stylesheet" href="kyv-theme.css">
</head>
<body class="flex h-screen overflow-hidden antialiased text-sm">

    <!-- CONTENITORE SIDEBAR -->
    <div id="kyv-sidebar-container" class="h-full z-50 absolute md:relative"></div>

    <main class="flex-1 flex flex-col h-screen overflow-hidden relative w-full">
        <section class="flex-1 flex flex-col h-full">
            <header class="pt-7 px-4 md:px-8 pb-5 border-b border-kyv-border/50 shrink-0">
                <div class="flex flex-col xl:flex-row items-start xl:items-end justify-between gap-5">
                    <div class="flex items-center">
                        <button class="md:hidden kyv-icon-action mr-3" onclick="toggleMobileMenu()" aria-label="Apri menu"><i data-lucide="menu" class="w-6 h-6"></i></button>
                        <div>
                            <p class="kyv-eyebrow mb-1">Catalogo operativo</p>
                            <h2 class="text-3xl md:text-4xl font-extrabold tracking-tight text-white">Progetti</h2>
                            <p class="text-kyv-text mt-2 text-xs md:text-sm">Trova il brano, controlla cosa manca e apri la sua scheda completa.</p>
                        </div>
                    </div>
                     
                    <div class="flex items-center gap-2 w-full xl:w-auto">
                        <div class="relative flex-1 xl:w-80">
                            <i data-lucide="search" class="w-4 h-4 absolute left-3 top-3 text-kyv-text"></i>
                            <input type="search" id="uscite-search" placeholder="Titolo, artista, stato…" aria-label="Cerca progetti" class="w-full bg-kyv-bg border border-kyv-border rounded-xl pl-9 pr-4 py-2.5 text-sm text-white focus:border-indigo-500 outline-none transition-colors" oninput="applyUsciteFilters()">
                        </div>
                        <button onclick="openDynamicModal()" class="kyv-primary-action whitespace-nowrap"><i data-lucide="plus" class="w-4 h-4 mr-2"></i><span class="hidden sm:inline">Nuovo progetto</span><span class="sm:hidden">Nuovo</span></button>
                        <button onclick="fetchUscite()" class="kyv-icon-action shrink-0" aria-label="Ricarica progetti" title="Ricarica"><i data-lucide="refresh-cw" class="w-4 h-4"></i></button>
                    </div>
                </div>

                <div class="mt-5 flex items-center justify-between gap-4">
                    <div class="flex space-x-2 overflow-x-auto custom-scrollbar pb-1">
                        <button onclick="applyUsciteFilters('WIP')" id="btn-filter-WIP" class="kyv-filter-pill bg-indigo-600 text-white border-indigo-500 uscite-filter-btn">In lavorazione</button>
                        <button onclick="applyUsciteFilters('TUTTI')" id="btn-filter-TUTTI" class="kyv-filter-pill border-kyv-border text-kyv-text uscite-filter-btn">Tutti</button>
                        <button onclick="applyUsciteFilters('USCITE')" id="btn-filter-USCITE" class="kyv-filter-pill border-kyv-border text-kyv-text uscite-filter-btn">Pubblicati</button>
                    </div>
                    <span id="project-count" class="kyv-chip shrink-0" aria-live="polite">0 progetti</span>
                </div>
            </header>
            
            <div class="flex-1 overflow-auto bg-kyv-bg relative custom-scrollbar p-4 md:p-8">
                <div class="bg-kyv-card rounded-xl border border-kyv-border overflow-hidden h-full flex flex-col shadow-xl">
                    <div class="overflow-auto custom-scrollbar flex-1">
                        <table class="kyv-project-table kyv-card-mode w-full text-left text-xs border-collapse border border-kyv-border">
                            <thead class="bg-[#12151e] text-kyv-text uppercase tracking-wider text-[10px] sticky top-0 z-10 shadow-sm border-b border-kyv-border">
                                <tr>
                                    <th class="px-4 py-3 font-semibold border-r border-kyv-border/40">Progetto</th>
                                    <th class="px-4 py-3 font-semibold border-r border-kyv-border/40">Stato</th>
                                    <th class="px-4 py-3 font-semibold border-r border-kyv-border/40">Timeline</th>
                                    <th class="px-4 py-3 font-semibold border-r border-kyv-border/40">Economia</th>
                                    <th class="px-4 py-3 font-semibold border-r border-kyv-border/40">Completezza</th>
                                    <th class="px-4 py-3 font-semibold text-right">Azioni</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-kyv-border/40" id="tbody-uscite">
                                <tr><td colspan="6" class="p-8 text-center text-kyv-text"><i data-lucide="loader-2" class="w-6 h-6 animate-spin mx-auto mb-2 text-indigo-500"></i></td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- MODAL GENERICA (INSERT & UPDATE) -->
    <div id="modal-dynamic" aria-hidden="true" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center hidden opacity-0 transition-opacity duration-300">
        <div class="bg-kyv-card border border-kyv-border rounded-xl shadow-2xl w-full max-w-4xl overflow-hidden transform scale-95 transition-transform duration-300 mx-4 max-h-[90vh] flex flex-col" id="modal-dynamic-content">
            <div class="px-6 py-4 border-b border-kyv-border flex justify-between items-center bg-kyv-bg/50 shrink-0">
                <h3 class="text-lg font-bold text-white flex items-center" id="dynamic-modal-title">
                    <i data-lucide="database" class="w-5 h-5 mr-2 text-indigo-400"></i> Gestione Progetto
                </h3>
                <button data-action="close-modal" data-target="modal-dynamic" class="text-kyv-text hover:text-white transition-colors">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <form id="form-dynamic" class="p-6 overflow-y-auto custom-scrollbar flex-1">
                <div id="dynamic-form-fields" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    <!-- Generato dinamicamente da JS -->
                </div>
                <div class="pt-6 flex justify-end space-x-3 mt-6 border-t border-kyv-border/50">
                    <button type="button" data-action="close-modal" data-target="modal-dynamic" class="px-4 py-2 text-sm font-medium text-kyv-text hover:text-white transition-colors">Annulla</button>
                    <button type="submit" id="btn-dynamic-salva" class="px-6 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-bold rounded-lg transition-colors flex items-center shadow-lg shadow-indigo-500/20">
                        <i data-lucide="save" class="w-4 h-4 mr-2"></i> Salva Modifiche
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" aria-live="polite" class="fixed bottom-5 right-5 px-6 py-3 rounded-lg shadow-lg transform transition-all duration-300 translate-y-20 opacity-0 z-50 pointer-events-none flex items-center">
        <i id="toast-icon" data-lucide="check-circle" class="w-5 h-5 mr-2"></i>
        <span id="toast-message" class="font-medium text-sm">Messaggio</span>
    </div>

    <script>
        if(typeof loadKyvSidebar === 'undefined'){ window.toggleMobileMenu=()=>{}; window.loadKyvSidebar=()=>{ document.getElementById('kyv-sidebar-container').innerHTML=`<aside class="w-64 bg-kyv-card border-r h-full p-4">Fallback Menu</aside>`;};}
        loadKyvSidebar('progetti');

        const fallbackUrl = 'https://sfclxyexipbgiohpwlnl.supabase.co';
        const fallbackKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNmY2x4eWV4aXBiZ2lvaHB3bG5sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExMTIwMDUsImV4cCI6MjA5NjY4ODAwNX0.6HJpyQGJBh4Gxyk4gcG6svm_b066XUvoyNk2UI8EHaY';
        const supabaseClient = KYV.createSupabaseClient();

        const fmtEuro = new Intl.NumberFormat('it-IT', { style: 'currency', currency: 'EUR' });
        function parseKyvNumber(val) { return (window.KYV_HELPERS ? KYV_HELPERS.parseKyvNumber(val) : KYV.parseNumber(val)); }
        function H(value) { return String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char])); }

        function showToast(msg, isError = false) { return (window.KYV_TOAST ? KYV_TOAST.show(msg, isError ? 'error' : 'success') : KYV.showToast(msg, isError ? 'error' : 'success')); }

        let usciteDataGlobal = [], currentUsciteFilter = 'WIP';
        
        // Setup Variabili Modale Progetti
        const tablePKs = { 'PROGETTI': 'ID' };
        const tableColumnsFallback = { 'PROGETTI': ['TITOLO', 'ARTISTA', 'MANAGEMENT', 'Label', 'AUTORI', 'STATO', 'SVILUPPO', 'Data_Sessione', 'Strumenti_Suonati_Kyv', 'NOTE', 'FEE', 'ROY', 'PAGAMENTO', 'Data_Pubblicazione', 'Codice_ISRC'] };
        let currentEditorTable = 'PROGETTI';
        let currentEditingRowId = null;
        let currentEditorData = []; // Array temporaneo che conterrò il record da modificare

        async function fetchUscite() {
            document.getElementById('tbody-uscite').innerHTML = '<tr><td colspan="6" class="p-8 text-center text-kyv-text"><i data-lucide="loader-2" class="w-6 h-6 animate-spin mx-auto mb-2 text-indigo-500"></i></td></tr>';
            try {
                // Recuperiamo tutti i campi (usando il fallback per le chiavi se servono)
                const { data, error } = await supabaseClient.from('PROGETTI').select('*').order('ID', { ascending: false }).limit(200);
                if(error) throw error; usciteDataGlobal = data || [];
                const searchInput = document.getElementById('uscite-search'); if(searchInput) searchInput.value = '';
                applyUsciteFilters('WIP'); 
            } catch(err) { document.getElementById('tbody-uscite').innerHTML = '<tr><td colspan="6" class="p-8 text-center text-red-500">Errore RLS o caricamento dati.</td></tr>'; }
        }

        window.applyUsciteFilters = function(filterOverride = null) {
            if (filterOverride) {
                currentUsciteFilter = filterOverride;
                document.querySelectorAll('.uscite-filter-btn').forEach(btn => { btn.classList.remove('bg-indigo-600', 'text-white', 'border-indigo-500', 'shadow-lg', 'shadow-indigo-500/20'); btn.classList.add('border-kyv-border', 'text-kyv-text'); });
                const activeBtn = document.getElementById('btn-filter-' + currentUsciteFilter); if(activeBtn) activeBtn.classList.add('bg-indigo-600', 'text-white', 'border-indigo-500', 'shadow-lg', 'shadow-indigo-500/20');
            }
            const searchTxt = (document.getElementById('uscite-search')?.value || '').toLowerCase();
            let filtered = usciteDataGlobal.filter(row => {
                let passStato = true;
                if (currentUsciteFilter === 'USCITE') passStato = (row.SVILUPPO === 'FINITA' || String(row.STATO).toUpperCase().includes('USCITA') || String(row.STATO).toUpperCase().includes('COMPLETAT'));
                else if (currentUsciteFilter === 'WIP') passStato = (row.SVILUPPO !== 'FINITA' && !String(row.STATO).toUpperCase().includes('USCITA'));
                let passText = true; if (searchTxt) passText = Object.values(row).some(val => val !== null && String(val).toLowerCase().includes(searchTxt));
                return passStato && passText;
            });
            
            const count = document.getElementById('project-count');
            if (count) count.textContent = `${filtered.length} ${filtered.length === 1 ? 'progetto' : 'progetti'}`;
            if(filtered.length === 0) { document.getElementById('tbody-uscite').innerHTML = '<tr><td colspan="6" class="p-10 text-center text-kyv-text"><i data-lucide="search-x" class="w-8 h-8 mx-auto mb-3 opacity-60"></i>Nessun progetto trovato. Prova un altro filtro o termine di ricerca.</td></tr>'; if(window.lucide) lucide.createIcons({ root: document.getElementById('tbody-uscite') }); return; }
            let html = [];
            filtered.forEach(row => {
                let dPub = row.Data_Pubblicazione ? new Date(row.Data_Pubblicazione).toLocaleDateString('it-IT') : '-'; let dSess = row.Data_Sessione ? new Date(row.Data_Sessione).toLocaleDateString('it-IT') : '-';
                let fee = row.FEE ? fmtEuro.format(parseKyvNumber(row.FEE)) : 'Fee non indicata'; let pagBadge = row.PAGAMENTO ? `<span class="${String(row.PAGAMENTO).toUpperCase() === 'SI' ? 'text-emerald-300' : 'text-amber-300'} text-[10px] font-black">${H(row.PAGAMENTO)}</span>` : '<span class="text-[10px] text-kyv-text">Pagamento n/d</span>';
                let royalty = row.ROY ? `${row.ROY}%` : '-';
                 
                const criticalMissing = ['TITOLO', 'ARTISTA', 'AUTORI', 'Contratto link', 'Data_Sessione'].filter(k => !String(row[k] || '').trim()).length;
                const rightsMissing = ['Codice_ISRC', 'Ruolo_IMAIE_Kyv', 'Data_Pubblicazione'].filter(k => !String(row[k] || '').trim()).length;
                const rowTone = criticalMissing > 1 ? 'border-l-4 border-l-rose-500 bg-rose-500/[0.03]' : (rightsMissing > 1 ? 'border-l-4 border-l-violet-500 bg-violet-500/[0.03]' : 'border-l-4 border-l-emerald-500/40');
                const missingTotal = criticalMissing + rightsMissing;
                const status = row.STATO || row.SVILUPPO || 'Stato non indicato';
                const statusTone = /USCITA|COMPLETAT|FINITA/i.test(`${row.STATO || ''} ${row.SVILUPPO || ''}`) ? 'is-done' : (/MIX|MASTER|LAVOR/i.test(status) ? 'is-active' : 'is-neutral');
                const projectId = encodeURIComponent(String(row.ID));
                html.push(`<tr class="hover:bg-indigo-500/10 cursor-pointer transition-colors group border-b border-kyv-border/40 ${rowTone}" data-action="open-ref" data-id="${row.ID}" title="Clicca per modificare il Progetto">
                        <td data-label="Progetto" class="px-4 py-3.5 border-r border-kyv-border/40 min-w-[220px]"><strong class="block text-sm text-white group-hover:text-indigo-200 truncate">${H(row.TITOLO || 'Senza titolo')}</strong><span class="block text-xs text-cyan-200 font-bold mt-1 truncate">${H(row.ARTISTA || 'Artista non indicato')}</span><span class="block text-[10px] text-kyv-text mt-1 truncate">${H([row.Label, row.MANAGEMENT].filter(Boolean).join(' · ') || 'Nessun referente')}</span></td>
                        <td data-label="Stato" class="px-4 py-3.5 border-r border-kyv-border/40 min-w-[145px]"><span class="kyv-status ${statusTone}">${H(status)}</span><span class="block text-[10px] text-kyv-text mt-2">${H(row.SVILUPPO || '')}</span></td>
                        <td data-label="Timeline" class="px-4 py-3.5 border-r border-kyv-border/40 min-w-[150px]"><span class="block text-white font-bold">Sessione · ${H(dSess)}</span><span class="block text-[10px] text-kyv-text mt-1">Pubblicazione · ${H(dPub)}</span></td>
                        <td data-label="Economia" class="px-4 py-3.5 border-r border-kyv-border/40 min-w-[145px]"><span class="block font-black text-emerald-200">${H(fee)}</span><span class="inline-flex items-center gap-2 mt-1">${pagBadge}<span class="text-[10px] text-kyv-text">ROY ${H(royalty)}</span></span></td>
                        <td data-label="Completezza" class="px-4 py-3.5 border-r border-kyv-border/40 min-w-[150px]"><span class="kyv-completion ${missingTotal === 0 ? 'is-complete' : ''}"><i data-lucide="${missingTotal === 0 ? 'check-circle-2' : 'circle-alert'}" class="w-4 h-4"></i>${missingTotal === 0 ? 'Completo' : `${missingTotal} da completare`}</span><span class="block text-[10px] text-kyv-text mt-2 font-mono">${H(row.Codice_ISRC || 'ISRC mancante')}</span></td>
                        <td data-label="Azioni" class="px-4 py-3.5 text-right min-w-[160px]"><div class="flex items-center justify-end gap-2"><a href="scheda_progetto.html?id=${projectId}" onclick="event.stopPropagation()" class="kyv-row-primary"><i data-lucide="panel-top-open" class="w-4 h-4"></i>Apri</a><button data-action="open-ref" data-id="${row.ID}" class="kyv-row-menu" aria-label="Modifica ${H(row.TITOLO || 'progetto')}" title="Modifica"><i data-lucide="pencil" class="w-4 h-4"></i></button></div></td></tr>`);
            });
            document.getElementById('tbody-uscite').innerHTML = html.join(''); if(window.lucide) lucide.createIcons({ root: document.getElementById('tbody-uscite') });
        }

        function openDynamicModal(rowId = null) {
            currentEditingRowId = rowId; const modal = document.getElementById('modal-dynamic');
            document.getElementById('dynamic-modal-title').innerHTML = rowId ? `<i data-lucide="edit" class="w-5 h-5 mr-2 text-indigo-400"></i> Modifica Progetto` : `<i data-lucide="plus-circle" class="w-5 h-5 mr-2 text-indigo-400"></i> Nuovo Progetto`;
            
            const pk = tablePKs[currentEditorTable]; 
            let keys = currentEditorData.length > 0 ? Object.keys(currentEditorData[0]) : tableColumnsFallback[currentEditorTable]; 
            keys = keys.filter(k => k !== pk && k !== '_RowNumber');
            let rowData = rowId ? currentEditorData.find(r => r[pk] == rowId) : null; 

            let html = '';
            keys.forEach(key => { 
                let val = rowData && rowData[key] !== null ? String(rowData[key]) : ''; 
                let isDate = key.toLowerCase().includes('data'); 
                let inputType = isDate ? 'date' : 'text'; 
                let extraStyle = isDate ? 'style="color-scheme: dark;"' : '';

                if (isDate && val) { val = val.substring(0, 10); } val = val.replace(/"/g, '&quot;'); 
                const priorityClass = window.KYV_PRIORITY ? KYV_PRIORITY.classFor(key, val) : '';
                const labelClass = window.KYV_PRIORITY ? KYV_PRIORITY.labelClassFor(key, val) : '';
                const hint = window.KYV_PRIORITY ? KYV_PRIORITY.explain(key) : '';
                html += `<div data-field-wrapper><label data-field-label class="block text-xs font-semibold text-kyv-text mb-1 uppercase tracking-wide truncate ${labelClass}" title="${hint}">${key}</label><input type="${inputType}" data-key="${key}" class="kyv-input dyn-input kyv-priority-input ${priorityClass}" value="${val}" placeholder="Inserisci..." ${extraStyle}></div>`; 
            });
            
            const formRoot = document.getElementById('dynamic-form-fields');
            formRoot.innerHTML = html;
            if(window.KYV_PRIORITY) KYV_PRIORITY.bind(formRoot);
            if(window.KYV_FIELD_MEMORY) KYV_FIELD_MEMORY.attachProjectDynamicInputs(formRoot);
            modal.classList.remove('hidden'); 
            setTimeout(() => { modal.classList.remove('opacity-0'); document.getElementById('modal-dynamic-content').classList.remove('scale-95'); if(window.lucide) lucide.createIcons({root: modal}); }, 10);
        }

        // Gestione Salva Form
        document.getElementById('form-dynamic').addEventListener('submit', async (e) => {
            e.preventDefault(); const btn = document.getElementById('btn-dynamic-salva'); btn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 mr-2 animate-spin"></i>...'; btn.disabled = true;
            let payload = {}; 
            
            const numericCols = ['FEE', 'ROY'];
            document.querySelectorAll('.dyn-input').forEach(inp => {
                let val = inp.value.trim(); const colKey = inp.dataset.key;
                if (val === '') { payload[colKey] = null; } 
                else {
                    if (numericCols.includes(colKey)) { val = val.replace(/[€$£%]/g, '').replace(/\s/g, '').replace(/\./g, '').replace(/,/g, '.'); }
                    payload[colKey] = val;
                }
            });

            try {
                const pk = tablePKs[currentEditorTable];
                if (currentEditingRowId) { const { error } = await supabaseClient.from(currentEditorTable).update(payload).eq(pk, currentEditingRowId); if(error) throw error; showToast("Progetto aggiornato!"); } 
                else { const { error } = await supabaseClient.from(currentEditorTable).insert([payload]); if(error) throw error; showToast("Progetto inserito!"); }
                
                document.getElementById('modal-dynamic').classList.add('opacity-0'); document.getElementById('modal-dynamic-content').classList.add('scale-95'); setTimeout(() => document.getElementById('modal-dynamic').classList.add('hidden'), 300);
                fetchUscite(); // Ricarica la lista per mostrare la modifica
            } catch (err) { 
                console.error(err); showToast("Errore: " + (err.message || "Formato dati non valido"), true); 
            } finally { 
                btn.innerHTML = '<i data-lucide="save" class="w-4 h-4 mr-2"></i> Salva Modifiche'; btn.disabled = false; if(window.lucide) lucide.createIcons({root: btn.parentElement}); 
            }
        });

        document.addEventListener('click', async (e) => {
            const btn = e.target.closest('[data-action]'); if (!btn) return; const action = btn.dataset.action;
            
            if (action === 'close-modal') { 
                const modal = document.getElementById(btn.dataset.target); modal.classList.add('opacity-0'); modal.querySelector('div').classList.add('scale-95'); setTimeout(() => modal.classList.add('hidden'), 300); 
            }
            else if (action === 'open-ref') {
                // Recupera il singolo record dal DB per assicurarsi di avere tutte le colonne (non solo quelle lette inizialmente)
                try { 
                    const { data, error } = await supabaseClient.from(currentEditorTable).select('*').eq(tablePKs[currentEditorTable], btn.dataset.id).single(); 
                    if (error) throw error; 
                    currentEditorData = [data]; // Imposta i dati per popolare il form
                    openDynamicModal(btn.dataset.id); 
                } catch(err) { showToast("Errore apertura progetto.", true); }
            }
        });

        document.addEventListener('DOMContentLoaded', async () => {
            await fetchUscite();
            if(new URLSearchParams(location.search).get('new') === '1') openDynamicModal();
        });
    </script>
</body>
</html>
