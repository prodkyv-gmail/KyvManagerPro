<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="icon" href="./favicon.ico">
    <title>KYV Studio - Calendar Module</title>

    <script>
        (function(){
            const originalWarn = console.warn;
            console.warn = function(){
                const first = String(arguments[0] || '');
                if(first.includes('cdn.tailwindcss.com should not be used in production')) return;
                return originalWarn.apply(console, arguments);
            };
        })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@0.468.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4"></script>

    <script src="config.js"></script>
    <script src="kyv-drive-bridge.js"></script>
    <script src="kyv-core.js"></script>
    <script src="kyv-toast.js"></script>
    <script src="kyv-helpers.js"></script>
    <script src="kyv-data-guard.js"></script>
    <script src="kyv-priority.js"></script>
    <script src="kyv-help.js"></script>
    <script src="kyv-auth.js"></script>
    <script src="menu.js"></script>
    <script src="kyv-responsive.js" defer></script>
    <script src="kyv-searchable-select.js" defer></script>
    <script src="kyv-field-memory.js" defer></script>
    <script src="kyv-link-viewer.js" defer></script>
    <script src="kyv-table-tools.js" defer></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] }, colors: { kyv: { bg: '#0f111a', card: '#151923', border: '#232838', text: '#94a3b8' } } } } }
    </script>
    <link rel="stylesheet" href="kyv-responsive.css">
    <style>
        body { background-color: #0f111a; color: #f8fafc; }
        .kyv-input { width: 100%; min-width: 0; background-color: #0f111a; border: 1px solid #232838; color: white; padding: 0.75rem 1rem; border-radius: 0.5rem; outline: none; transition: all 0.2s ease; }
        .kyv-input:focus { border-color: #3b82f6; box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2); }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #232838; border-radius: 3px; }
        ::-webkit-scrollbar { width: 16px; height: 16px; }
        ::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.02); border-radius: 8px; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 8px; border: 4px solid #0f111a; }
        ::-webkit-scrollbar-thumb:hover { background: #6b7280; }
        .custom-scrollbar { scrollbar-width: auto; scrollbar-color: #4b5563 rgba(255, 255, 255, 0.02); }
        .custom-scrollbar::-webkit-scrollbar { width: 16px; height: 16px; }

        /* Agenda responsive: niente pannelli compressi o contenuti spostati fuori area. */
        .kyv-calendar-layout { display:grid; grid-template-columns:minmax(0,1fr); gap:1.5rem; min-width:0; }
        .kyv-calendar-sidebar, .kyv-calendar-main, .kyv-calendar-card { min-width:0; width:100%; max-width:100%; }
        .kyv-calendar-layout > * { min-width:0; }
        .kyv-calendar-main { container-type:inline-size; container-name:kyv-calendar; }
        .kyv-calendar-main #events-list, .kyv-calendar-main #kyv-cal-grid { min-width:0; max-width:100%; overflow-x:hidden; }
        .kyv-calendar-main .kyv-cal-bar, .kyv-calendar-main .kyv-cal-week, .kyv-calendar-main .kyv-cal-month { min-width:0; max-width:100%; }

        .kyv-calendar-card { overflow:visible; }
        #form-new-event, #form-new-event > *, #form-new-event input, #form-new-event button { min-width:0; max-width:100%; }
        #events-list { min-width:0; }
        #events-list h3 { overflow-wrap:anywhere; }
        @media (min-width:1536px) {
            .kyv-calendar-layout { grid-template-columns:minmax(360px,420px) minmax(0,1fr); align-items:start; }
        }
    </style>
    <link rel="stylesheet" href="kyv-theme.css">
</head>
<body class="kyv-v260 flex h-screen overflow-hidden antialiased text-sm">
    <div id="kyv-sidebar-container" class="h-full z-50 absolute md:relative shrink-0"></div>

    <main class="flex-1 flex flex-col h-screen overflow-hidden relative w-full min-w-0 bg-kyv-bg">
        <div class="absolute top-0 right-1/4 transform translate-x-1/2 w-[600px] h-[600px] bg-blue-600/5 rounded-full blur-[120px] pointer-events-none"></div>

        <section class="flex-1 overflow-y-auto w-full h-full p-4 sm:p-6 lg:p-8 pt-8 custom-scrollbar relative z-10 flex flex-col min-w-0">
            <header class="flex flex-col sm:flex-row justify-between sm:items-end gap-4 mb-6 shrink-0 border-b border-kyv-border/50 pb-6 min-w-0">
                <div class="flex items-center min-w-0">
                    <button class="md:hidden text-kyv-text hover:text-white mr-3 transition-colors shrink-0" onclick="toggleMobileMenu()">
                        <i data-lucide="menu" class="w-6 h-6"></i>
                    </button>
                    <div class="min-w-0">
                        <h2 class="text-2xl sm:text-3xl font-extrabold tracking-tight">Google <span class="text-blue-500">Calendar</span></h2>
                        <p class="text-kyv-text mt-1 text-xs sm:text-sm">Gestione sessioni e sincronizzazione appuntamenti in studio.</p>
                    </div>
                </div>
            </header>

            <div class="kyv-calendar-layout w-full min-h-0">
                <div class="kyv-calendar-sidebar flex flex-col gap-6">
                    <div class="kyv-calendar-card bg-kyv-card border border-kyv-border rounded-2xl p-4 sm:p-6 shadow-xl relative group">
                        <h3 class="font-bold text-white mb-4 flex items-center text-sm">
                            <i data-lucide="link" class="w-4 h-4 mr-2 text-kyv-text"></i> Connessione Google Apps Script
                        </h3>
                        <div class="space-y-3 min-w-0">
                            <div class="rounded-xl border border-blue-500/20 bg-blue-500/[0.06] px-3 py-2 min-w-0">
                                <p class="text-[10px] uppercase tracking-wider text-kyv-text font-bold">Account atteso</p>
                                <p id="calendar-account" class="mt-1 text-xs font-bold text-blue-200 break-all">prodkyv@gmail.com</p>
                            </div>
                            <div class="relative min-w-0">
                                <i data-lucide="key" class="w-3.5 h-3.5 absolute left-3 top-1/2 transform -translate-y-1/2 text-blue-500/50"></i>
                                <input type="password" id="script-url" class="kyv-input text-xs font-mono text-blue-300 pl-9 opacity-50 select-none cursor-not-allowed" readonly value="********************************************************" title="Connessione protetta gestita da config.js">
                            </div>
                            <button id="btn-sync" class="w-full min-w-0 py-2.5 bg-kyv-border hover:bg-blue-600 text-white font-bold rounded-xl text-xs transition-colors flex items-center justify-center border border-kyv-border hover:border-blue-500">
                                <i data-lucide="refresh-cw" class="w-3.5 h-3.5 mr-2 shrink-0" id="sync-icon"></i> <span id="sync-text">Aggiorna agenda</span>
                            </button>
                        </div>
                    </div>

                    <div class="kyv-calendar-card bg-kyv-card border border-emerald-500/20 rounded-2xl p-4 sm:p-6 shadow-xl relative">
                        <div class="absolute -right-6 -top-6 w-24 h-24 bg-emerald-500/10 rounded-full blur-2xl pointer-events-none"></div>
                        <h3 class="font-bold text-white mb-5 flex items-center text-lg relative z-10">
                            <i data-lucide="plus-circle" class="w-5 h-5 mr-2 text-emerald-400"></i> Crea Sessione
                        </h3>

                        <form id="form-new-event" class="space-y-4 relative z-10 w-full min-w-0">
                            <div class="w-full min-w-0">
                                <label class="block text-[10px] font-bold text-kyv-text uppercase tracking-wider mb-1.5">Titolo Evento</label>
                                <input type="text" id="ev-title" required placeholder="Es. Registrazione Voci" class="kyv-input bg-[#0f111a] text-sm">
                            </div>
                            <div class="grid grid-cols-1 gap-3 w-full min-w-0">
                                <div class="min-w-0">
                                    <label class="block text-[10px] font-bold text-kyv-text uppercase tracking-wider mb-1.5">Data</label>
                                    <input type="date" id="ev-date" required class="kyv-input bg-[#0f111a] text-sm" style="color-scheme: dark;">
                                </div>
                                <div class="min-w-0">
                                    <label class="block text-[10px] font-bold text-kyv-text uppercase tracking-wider mb-1.5">Ora inizio</label>
                                    <input type="time" id="ev-time" required class="kyv-input bg-[#0f111a] text-sm" style="color-scheme: dark;">
                                </div>
                                <div class="min-w-0">
                                    <label for="ev-end-time" class="block text-[10px] font-bold text-kyv-text uppercase tracking-wider mb-1.5">Ora fine</label>
                                    <input type="time" id="ev-end-time" required class="kyv-input bg-[#0f111a] text-sm" style="color-scheme: dark;">
                                </div>
                                <div class="min-w-0">
                                    <label for="ev-description" class="block text-[10px] font-bold text-kyv-text uppercase tracking-wider mb-1.5">Descrizione (facoltativa)</label>
                                    <textarea id="ev-description" maxlength="5000" rows="3" placeholder="Dettagli della sessione, partecipanti, note..." class="kyv-input bg-[#0f111a] text-sm"></textarea>
                                </div>
                                <div class="min-w-0">
                                    <label for="ev-location" class="block text-[10px] font-bold text-kyv-text uppercase tracking-wider mb-1.5">Luogo (facoltativo)</label>
                                    <input type="text" id="ev-location" maxlength="500" placeholder="Studio / indirizzo" class="kyv-input bg-[#0f111a] text-sm">
                                </div>
                            </div>
                            <button type="submit" id="btn-create" class="w-full min-w-0 py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl text-sm transition-colors flex items-center justify-center shadow-lg shadow-emerald-500/20 border border-emerald-500 mt-2">
                                <i data-lucide="calendar-plus" class="w-4 h-4 mr-2 shrink-0" id="create-icon"></i> Crea su Calendar
                            </button>
                        </form>
                    </div>
                </div>

                <div class="kyv-calendar-main bg-kyv-card border border-kyv-border rounded-2xl flex flex-col shadow-xl overflow-hidden min-h-[400px] lg:min-h-[520px]">
                    <div class="p-4 sm:p-5 border-b border-kyv-border flex flex-col sm:flex-row sm:justify-between sm:items-center gap-2 shrink-0 bg-kyv-bg/30 min-w-0">
                        <h2 class="font-bold text-white flex items-center text-lg min-w-0">
                            <i data-lucide="calendar-days" class="w-5 h-5 mr-3 text-blue-400 shrink-0"></i> Calendario
                        </h2>
                        <span class="text-[10px] font-mono bg-[#0f111a] border border-kyv-border px-2.5 py-1 rounded-md text-kyv-text self-start sm:self-auto" id="last-sync">Pronto</span>
                    </div>

                    <div class="flex-1 overflow-y-auto p-4 sm:p-6 space-y-3 custom-scrollbar min-w-0" id="events-list">
                        <div class="flex flex-col items-center justify-center h-full min-h-[280px] text-kyv-text opacity-70 text-center p-6">
                            <i data-lucide="calendar-days" class="w-12 h-12 mb-3 text-blue-500"></i>
                            <p class="text-sm font-bold text-white">Agenda pronta</p>
                            <p class="text-xs mt-2">Premi “Aggiorna agenda” per caricare gli appuntamenti di Google Calendar.</p>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <div id="toast" aria-live="polite" class="fixed bottom-5 right-5 px-6 py-3 rounded-lg shadow-lg transform transition-all duration-300 translate-y-20 opacity-0 z-50 pointer-events-none flex items-center">
        <i id="toast-icon" data-lucide="check-circle" class="w-5 h-5 mr-2"></i>
        <span id="toast-message" class="font-medium text-sm">Messaggio</span>
    </div>

    <script>
        if(typeof loadKyvSidebar === 'undefined'){ window.toggleMobileMenu=()=>{}; window.loadKyvSidebar=()=>{ document.getElementById('kyv-sidebar-container').innerHTML=`<aside class="w-64 bg-kyv-card border-r h-full p-4"><p class="text-rose-400 text-xs">Fallback Menu</p></aside>`;};}
        loadKyvSidebar('calendar');

        const calendarAccount = window.KYV_CONFIG?.GOOGLE_CALENDAR_ACCOUNT || {
            id: 'calendar-prodkyv',
            label: 'Calendar prodkyv@gmail.com',
            email: 'prodkyv@gmail.com',
            url: window.KYV_CONFIG?.GOOGLE_SCRIPT_URL || ''
        };

        let listEventsCache = [];
        const DOM = {
            btnSync: document.getElementById('btn-sync'),
            syncIcon: document.getElementById('sync-icon'),
            syncText: document.getElementById('sync-text'),
            eventsList: document.getElementById('events-list'),
            lastSync: document.getElementById('last-sync'),
            formNew: document.getElementById('form-new-event'),
            btnCreate: document.getElementById('btn-create'),
            createIcon: document.getElementById('create-icon')
        };

        function showToast(msg, isError = false) {
            return window.KYV_TOAST ? KYV_TOAST.show(msg, isError ? 'error' : 'success') : KYV.showToast(msg, isError ? 'error' : 'success');
        }

        function H(value){
            return String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
        }

        async function calendarRequest(action, params = {}){
            if(!calendarAccount.url) throw new Error(`Calendar ${calendarAccount.email}: URL Apps Script non configurato.`);
            if(!window.KYV_DRIVE?.fetchJson) throw new Error('Proxy Calendar non disponibile: ricarica la pagina.');
            return window.KYV_DRIVE.fetchJson(calendarAccount, action, params);
        }

        document.getElementById('calendar-account').textContent = calendarAccount.email;

        // Lettura manuale del periodo: nessuna scrittura e nessuna supposizione
        // sull'intervallo restituito dal vecchio Apps Script.
        window.addEventListener('kyv:calendar-period-request', async (event) => {
            const detail = event && event.detail;
            if(!detail || !detail.requested) return;
            const { requested, requestId } = detail;
            let response = null;
            let success = false;
            let truncated = false;
            let error = '';
            try {
                response = await calendarRequest('getEvents', {
                    startDate: requested.startDate, endDate: requested.endDate
                });
                if(response.error) throw new Error(response.error);
                success = Array.isArray(response.events);
                truncated = success && (response.truncated === true || response.events.length >= 120);
                if(success) response = { ...response, events: response.events.slice(0,120) };
            } catch(err) {
                error = String(err.message || err || 'Connessione Apps Script non riuscita').slice(0,180);
                console.warn('[KYV Calendar] Lettura periodo non verificata:', error);
            }
            window.dispatchEvent(new CustomEvent('kyv:calendar-period-result', {
                detail: { requested, requestId, response, success, truncated, error }
            }));
        });


        // Elenco accessibile con tastiera: il dettaglio è gestito dal dialog comune alle altre viste.
        DOM.eventsList.addEventListener('click', (event) => {
            const button = event.target.closest('[data-kyv-calendar-index]');
            if(!button || !DOM.eventsList.contains(button)) return;
            const index = Number(button.dataset.kyvCalendarIndex);
            if(!Number.isSafeInteger(index) || index < 0 || index >= listEventsCache.length) return;
            window.dispatchEvent(new CustomEvent('kyv:calendar-open-event', {
                detail: { event: listEventsCache[index], opener: button }
            }));
        });

        DOM.btnSync.addEventListener('click', async () => {
            DOM.btnSync.disabled = true;
            DOM.syncIcon.classList.add('animate-spin');
            DOM.syncText.innerText = 'Sincronizzazione...';
            DOM.eventsList.innerHTML = `<div class="flex flex-col items-center justify-center h-full min-h-[280px] text-blue-500 text-center p-6"><i data-lucide="loader-2" class="w-10 h-10 animate-spin mb-4"></i><p class="text-sm font-bold tracking-wide">Lettura Agenda in corso...</p></div>`;
            if(window.lucide) lucide.createIcons({root: DOM.eventsList});

            try {
                // Solo da oggi in avanti: nessuna lettura dello storico.
                const today = new Date();
                const from = new Date(today.getFullYear(),today.getMonth(),today.getDate());
                const to = new Date(today.getFullYear(),today.getMonth(),today.getDate()+15);
                const dayString = date => date.getFullYear() + '-' + String(date.getMonth()+1).padStart(2,'0') + '-' + String(date.getDate()).padStart(2,'0');
                const wanted = { startDate: dayString(from), endDate: dayString(to) };
                const data = await calendarRequest('getEvents', wanted);
                if(data.error) throw new Error(data.error);
                if(!Array.isArray(data.events)) throw new Error('Lo script Google non ha restituito un elenco di eventi valido.');
                const confirmedRange = data.range?.startDate === wanted.startDate &&
                    data.range?.endDate === wanted.endDate;
                // Legacy Apps Script returns valid events but does not include "range".
                // Do not mistake that compatible response for a network/auth error.
                // An explicitly wrong range is still an error: never pretend it is confirmed.
                if(data.range && !confirmedRange) {
                    throw new Error('Google Apps Script ha restituito un periodo differente da quello richiesto. Verifica il deployment.');
                }
                const legacyMode = !confirmedRange;
                const events = data.events.filter(ev => {
                    const parsed = /^\d{4}-\d{2}-\d{2}$/.test(String(ev?.date||''))
                        ? new Date(Number(ev.date.slice(0,4)),Number(ev.date.slice(5,7))-1,Number(ev.date.slice(8,10)))
                        : new Date(ev?.date);
                    return !Number.isNaN(parsed.getTime()) &&
                        dayString(parsed) >= wanted.startDate && dayString(parsed) < wanted.endDate;
                }).slice(0,120);
                const partial = !!data.truncated || data.events.length>=120 || legacyMode;
                DOM.lastSync.innerHTML = legacyMode
                    ? '<span class="text-amber-400">●</span> Eventi disponibili · intervallo non verificato'
                    : `<span class="text-emerald-400">●</span> ${new Date().toLocaleTimeString('it-IT')}`;
                listEventsCache = events;
                window.dispatchEvent(new CustomEvent('kyv:calendar-events', {
                    detail: { events, success: true, truncated: partial }
                }));
                if(events.length === 0) {
                    DOM.eventsList.innerHTML = `<div class="flex flex-col items-center justify-center h-full min-h-[280px] text-kyv-text opacity-70 text-center p-6"><i data-lucide="calendar-check-2" class="w-16 h-16 mb-4 opacity-50"></i><p class="text-lg font-medium">${legacyMode ? 'Nessun appuntamento tra quelli disponibili.' : 'Nessun appuntamento in agenda.'}</p>${legacyMode ? '<p class="text-xs mt-2">Connessione Apps Script funzionante, ma la versione pubblicata non conferma il periodo: vista limitata ai dati restituiti.</p>' : ''}</div>`;
                } else {
                    let html = '';
                    events.forEach((ev, index) => {
                        const dt = new Date(ev.date);
                        if(Number.isNaN(dt.getTime())) return;
                        const dayName = H(dt.toLocaleDateString('it-IT', { weekday: 'short' }));
                        const monthName = H(dt.toLocaleDateString('it-IT', { month: 'short' }));
                        const time = H(dt.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' }));

                        html += `
                            <button type="button" data-kyv-calendar-index="${index}" aria-label="Apri dettagli evento: ${H(ev.title || 'Senza titolo')}" class="w-full text-left bg-kyv-bg border border-kyv-border rounded-xl p-3 sm:p-4 flex items-center hover:border-blue-500/40 hover:bg-[#11141f] focus-visible:outline focus-visible:outline-2 focus-visible:outline-blue-400 transition-all group min-w-0">
                                <span class="block bg-kyv-card border border-kyv-border/50 rounded-lg p-2 text-center mr-3 sm:mr-4 w-14 sm:w-16 shrink-0 group-hover:bg-blue-900/10 transition-colors">
                                    <span class="block text-[9px] text-blue-400 font-bold uppercase tracking-wider">${dayName}</span>
                                    <span class="block text-xl font-black text-white leading-none my-0.5">${dt.getDate()}</span>
                                    <span class="block text-[9px] text-kyv-text uppercase font-semibold">${monthName}</span>
                                </span>
                                <span class="block flex-1 min-w-0">
                                    <span class="font-bold text-white text-sm mb-1 break-words group-hover:text-blue-300 transition-colors">${H(ev.title || 'Senza titolo')}</span>
                                    <span class="text-[10px] text-kyv-text flex items-center font-mono uppercase tracking-wider"><i data-lucide="clock" class="w-3 h-3 mr-1.5 opacity-70 shrink-0"></i> Ore ${time}</span>
                                </span>
                            </button>`;
                    });
                    DOM.eventsList.innerHTML = '<p class="text-xs text-kyv-text pb-1">Eventi di oggi e dei prossimi 14 giorni. Lo storico è disattivato. Seleziona un evento per aprire i dettagli.' +
                        (legacyMode ? ' Modalità compatibilità: lo script Google non conferma le date. L’elenco potrebbe essere incompleto; aggiorna il deployment Apps Script per leggere gli intervalli esatti.' :
                        (partial ? ' Attenzione: elenco parziale (massimo 120 eventi).' : '')) + '</p>' + html;
                }
                if(window.lucide) lucide.createIcons({root: DOM.eventsList});
            } catch(err) {
                listEventsCache = [];
                window.dispatchEvent(new CustomEvent('kyv:calendar-events', { detail: { events: [], success: false } }));
                const message = err.message || 'Errore di connessione.';
                showToast(message, true);
                DOM.lastSync.innerHTML = '<span class="text-rose-400">●</span> Non connesso';
                DOM.eventsList.innerHTML = `<div class="flex flex-col items-center justify-center h-full min-h-[280px] text-red-400 text-center p-6"><i data-lucide="alert-triangle" class="w-14 h-14 mb-4 opacity-60"></i><p class="font-medium break-words max-w-3xl">${H(message)}</p><p class="mt-2 text-xs text-kyv-text">Nessun evento è stato modificato.</p></div>`;
                if(window.lucide) lucide.createIcons({root: DOM.eventsList});
            } finally {
                DOM.btnSync.disabled = false;
                DOM.syncIcon.classList.remove('animate-spin');
                DOM.syncText.innerText = 'Aggiorna agenda';
            }
        });

        DOM.formNew.addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = document.getElementById('ev-title').value;
            const date = document.getElementById('ev-date').value;
            const time = document.getElementById('ev-time').value;
            const endTime = document.getElementById('ev-end-time').value;
            const description = document.getElementById('ev-description').value.trim();
            const location = document.getElementById('ev-location').value.trim();
            if(!endTime || endTime <= time){
                showToast('L’ora di fine deve essere successiva all’ora di inizio.', true);
                return;
            }
            const confirmed = window.confirm(`Confermi la creazione su ${calendarAccount.email}?\n\n${title}\n${date} dalle ${time} alle ${endTime}${location ? '\nLuogo: ' + location : ''}`);
            if(!confirmed) return;

            DOM.btnCreate.disabled = true;
            DOM.createIcon.setAttribute('data-lucide', 'loader-2');
            DOM.createIcon.classList.add('animate-spin');
            if(window.lucide) lucide.createIcons({root: DOM.btnCreate.parentElement});

            try {
                const data = await calendarRequest('createEvent', {
                    title,
                    date,
                    time,
                    endTime,
                    description,
                    location,
                    clientRequestId: `calendar-${Date.now()}-${Math.random().toString(36).slice(2, 10)}`
                });

                if(data.error) throw new Error(data.error);
                showToast('Evento inserito in Google Calendar!');
                DOM.formNew.reset();
                window.dispatchEvent(new CustomEvent('kyv:calendar-created'));
                setTimeout(() => DOM.btnSync.click(), 500);
            } catch(err) {
                showToast(err.message || 'Errore durante la creazione.', true);
            } finally {
                DOM.btnCreate.disabled = false;
                DOM.createIcon.setAttribute('data-lucide', 'calendar-plus');
                DOM.createIcon.classList.remove('animate-spin');
                if(window.lucide) lucide.createIcons({root: DOM.btnCreate.parentElement});
            }
        });

        // Nessuna sincronizzazione automatica: evita freeze e rende l'apertura dell'Agenda immediata.
        document.addEventListener('DOMContentLoaded', () => {
            const now = new Date();
            const localDate = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0');
            document.getElementById('ev-date').value = localDate;
            document.getElementById('ev-time').value = '11:00';
            document.getElementById('ev-end-time').value = '13:00';
            if(window.lucide) lucide.createIcons();
        });
    </script>
</body>
</html>
